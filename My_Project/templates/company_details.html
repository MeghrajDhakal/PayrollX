{% extends "base.html" %}
{% block title %}Company Details{% endblock %}
{% block content %}
<div class="page-header">
    <div class="page-header-copy">
        <h1><i class="fas fa-building text-accent" aria-hidden="true"></i> Company Details</h1>
        <p>Manage your organization's legal entity identifiers, statutory registrations, and bank mandate.</p>
    </div>
</div>

<section class="data-card">
    <div class="data-card-header">
        <h2><i class="fas fa-building text-accent" aria-hidden="true"></i> Organization Profile</h2>
    </div>
    <div class="data-card-body">
        <div class="form-row">
            <div class="form-group">
                <label for="co_name">Company Name</label>
                <input id="co_name" type="text" class="form-control" value="{{ current_user.organization.name if current_user.organization else 'Workspace' }}" readonly>
            </div>
            <div class="form-group">
                <label for="co_type">Company Type</label>
                <input id="co_type" type="text" class="form-control" value="Private Limited" readonly>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="co_cin">CIN</label>
                <input id="co_cin" type="text" class="form-control mono" value="U72200KA2020PTC123456" readonly>
            </div>
            <div class="form-group">
                <label for="co_pan">PAN</label>
                <input id="co_pan" type="text" class="form-control mono" value="AABCL1234F" readonly>
            </div>
        </div>
        <div class="form-row" style="margin-block-end: 0;">
            <div class="form-group" style="margin-block-end: 0;">
                <label for="co_tan">TAN</label>
                <input id="co_tan" type="text" class="form-control mono" value="BLRL12345F" readonly>
            </div>
            <div class="form-group" style="margin-block-end: 0;">
                <label for="co_gstin">GSTIN</label>
                <input id="co_gstin" type="text" class="form-control mono" value="29AABCL1234F1Z5" readonly>
            </div>
        </div>
    </div>
</section>

<section class="data-card">
    <div class="data-card-header">
        <h2><i class="fas fa-gavel text-success" aria-hidden="true"></i> Statutory Registrations</h2>
    </div>
    <div class="data-card-body">
        <div class="form-row">
            <div class="form-group">
                <label for="reg_epf">EPF Establishment Code</label>
                <input id="reg_epf" type="text" class="form-control mono" value="KABLR0012345000" readonly>
            </div>
            <div class="form-group">
                <label for="reg_esi">ESI Establishment Code</label>
                <input id="reg_esi" type="text" class="form-control mono" value="31001234560000099" readonly>
            </div>
        </div>
        <div class="form-row" style="margin-block-end: 0;">
            <div class="form-group" style="margin-block-end: 0;">
                <label for="reg_pt">Professional Tax Registration</label>
                <input id="reg_pt" type="text" class="form-control mono" value="PTKA12345678" readonly>
            </div>
            <div class="form-group" style="margin-block-end: 0;">
                <label for="reg_lin">LIN (Labour ID)</label>
                <input id="reg_lin" type="text" class="form-control mono" value="1234567890123456789" readonly>
            </div>
        </div>
    </div>
</section>

<section class="data-card">
    <div class="data-card-header">
        <h2><i class="fas fa-university text-warning" aria-hidden="true"></i> Primary Debit Bank Details</h2>
    </div>
    <div class="data-card-body">
        <div class="form-row">
            <div class="form-group">
                <label for="bank_name">Bank Name</label>
                <input id="bank_name" type="text" class="form-control" value="HDFC Bank" readonly>
            </div>
            <div class="form-group">
                <label for="bank_acc">Account Number</label>
                <input id="bank_acc" type="text" class="form-control mono" value="50100012345678" readonly>
            </div>
        </div>
        <div class="form-row" style="margin-block-end: 0;">
            <div class="form-group" style="margin-block-end: 0;">
                <label for="bank_ifsc">IFSC Code</label>
                <input id="bank_ifsc" type="text" class="form-control mono" value="HDFC0001234" readonly>
            </div>
            <div class="form-group" style="margin-block-end: 0;">
                <label for="bank_branch">Branch</label>
                <input id="bank_branch" type="text" class="form-control" value="Koramangala, Bangalore" readonly>
            </div>
        </div>
    </div>
</section>
{% endblock %}
